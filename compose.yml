services:
  app:
    build: .
    image: contador:v2
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASS=***REMOVED***
      - DB_NAME=db-contador
    
    restart: unless-stopped
    depends_on:
     db:
      condition: service_healthy
    deploy:
      replicas: 3
    networks:
      - frontend
      - backend
        
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=***REMOVED***
      - POSTGRES_DB=db-contador
    volumes:
      - volumen-contenedor:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db-contador"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
  proxy:
    image: nginx:1.31.2-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - frontend
    
volumes:
  volumen-contenedor:


networks:
  frontend:
  backend:


