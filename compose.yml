services:
  app:
    build: .
    image: contador:v2
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=contador_app
      - DB_PASS_FILE=/run/secrets/db_app_password
      - DB_NAME=db-contador
    
    restart: unless-stopped
    depends_on:
     db:
      condition: service_healthy
    deploy:
      replicas: 3
    networks:
      - frontend
      - backend
    secrets:
      - db_app_password
        
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=db-contador
    volumes:
      - volumen-contenedor:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db-contador"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    secrets:
      - db_password
      - db_app_password
  proxy:
    image: nginx:1.31.2-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - frontend
    
volumes:
  volumen-contenedor:


networks:
  frontend:
  backend:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt
